services:
  redis:
    image: redis:7-alpine
    container_name: airbnb_redis
    ports:
      - "6379:6379"

  backend:
    build: ./Backend
    container_name: airbnb_backend
    dns:
      - 8.8.8.8
      - 1.1.1.1

    ports:
      - "3000:3000"

    env_file:
      - .env
    


    depends_on:
      - redis

  frontend:
    build: ./Fronted/vite-project
    container_name: airbnb_frontend

    ports:
      - "5173:80"

    depends_on:
      - backend